name: Deploy SDK Info to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish WASM
        run: |
          dotnet publish src/Web --configuration Release \
            -p:GHPages=true \
            --output publish/

      - name: Set base href for project-pages subpath
        # The app is served from https://<org>.github.io/SdkInfoApp/ (a sub-path), so the
        # generated index.html <base href="/"> must become "/SdkInfoApp/" or every relative
        # asset (_framework, _content, lib, snapshots) 404s and the app never boots.
        # .nojekyll prevents any processing of the _framework/_content underscore folders.
        run: |
          sed -i 's|<base href="/" />|<base href="/SdkInfoApp/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          echo "base href is now:"; grep -i '<base' publish/wwwroot/index.html

      - name: Create snapshots directory
        run: mkdir -p publish/wwwroot/snapshots

      - name: Fetch previously deployed snapshots (fallback)
        # Best-effort: if the live site has no index yet (first deploy) or is unreachable,
        # there is simply no fallback and the scan result is used as-is.
        run: |
          BASE="https://bieberworks.github.io/SdkInfoApp/snapshots"
          mkdir -p fallback
          if curl -fsSL --retry 2 "$BASE/index.json" -o fallback/index.json; then
            python3 -c "
          import json
          for e in json.load(open('fallback/index.json')).get('branches', []):
              print(e['branch'])
          " > fallback/branches.txt || : > fallback/branches.txt
            while read -r B; do
              curl -fsSL --retry 2 "$BASE/sdk-snapshot.${B}.json" -o "fallback/sdk-snapshot.${B}.json" \
                || rm -f "fallback/sdk-snapshot.${B}.json"
            done < fallback/branches.txt
          else
            echo "No previous index available - no fallback"
            rm -f fallback/index.json
          fi
          ls -la fallback

      - name: Scan branches and build index
        # SDK_READ_TOKEN must be a PAT with 'contents: read' on BieberWorks/SDK-* repos.
        # The default GITHUB_TOKEN only has access to this repository and cannot read
        # the private SDK-* repos in the BieberWorks org.
        # Branches are scanned in priority order: main first (used as default in the app).
        # A branch counts as freshly scanned only if the scanner exits 0 and the snapshot has >0 modules.
        # Otherwise the previously deployed snapshot (fallback/) is carried over with its OLD
        # generatedAt and "stale":true, and the branch is recorded in the 'degraded' output so the
        # final step can fail the job AFTER the deploy.
        id: scan
        env:
          GH_TOKEN: ${{ secrets.SDK_READ_TOKEN }}
        run: |
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SNAP_DIR="publish/wwwroot/snapshots"
          ENTRIES_FILE=$(mktemp)
          DEGRADED=""

          module_count() {
            python3 -c "
          import json, sys
          try:
              print(len(json.load(open(sys.argv[1])).get('modules', [])))
          except Exception:
              print(0)
          " "$1"
          }

          old_generated_at() {
            python3 -c "
          import json, sys
          try:
              for e in json.load(open('fallback/index.json')).get('branches', []):
                  if e['branch'] == sys.argv[1]:
                      print(e.get('generatedAt', ''))
          except Exception:
              pass
          " "$1"
          }

          add_entry() { # branch generatedAt stale(true|false)
            python3 -c "
          import json, sys
          b, at, stale = sys.argv[1:4]
          e = {'branch': b, 'file': f'snapshots/sdk-snapshot.{b}.json', 'generatedAt': at}
          if stale == 'true':
              e['stale'] = True
          print(json.dumps(e))
          " "$1" "$2" "$3" >> "$ENTRIES_FILE"
          }

          for BRANCH in main staging dev; do
            OUT="$SNAP_DIR/sdk-snapshot.${BRANCH}.json"
            FALLBACK="fallback/sdk-snapshot.${BRANCH}.json"
            echo "--- Scanning branch: $BRANCH ---"

            SCAN_RC=0
            dotnet run --project src/Scanner --configuration Release \
              -- --mode release --org BieberWorks \
                 --branch "$BRANCH" \
                 --output "$OUT" || SCAN_RC=$?

            COUNT=0
            if [ "$SCAN_RC" -eq 0 ] && [ -f "$OUT" ]; then
              COUNT=$(module_count "$OUT")
            fi
            echo "Branch $BRANCH: scanner exit=$SCAN_RC, $COUNT modules"

            if [ "$COUNT" -gt 0 ]; then
              add_entry "$BRANCH" "$GENERATED_AT" false
              continue
            fi

            rm -f "$OUT"
            DEGRADED="$DEGRADED $BRANCH"
            if [ -f "$FALLBACK" ]; then
              OLD_AT=$(old_generated_at "$BRANCH")
              echo "::warning::Branch $BRANCH not freshly scanned - carrying over previous snapshot (generatedAt=${OLD_AT:-unknown})"
              cp "$FALLBACK" "$OUT"
              add_entry "$BRANCH" "$OLD_AT" true
            else
              echo "::warning::Branch $BRANCH not freshly scanned and no fallback available - excluded from index"
            fi
          done

          python3 -c "
          import json, sys
          entries = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          json.dump({'branches': entries}, open(sys.argv[2], 'w'))
          " "$ENTRIES_FILE" "$SNAP_DIR/index.json"
          echo "--- index.json ---"
          cat "$SNAP_DIR/index.json"; echo

          echo "degraded=$(echo $DEGRADED)" >> "$GITHUB_OUTPUT"

      - name: Create 404.html SPA fallback
        # GitHub Pages returns 404.html for any path that does not exist.
        # This script redirects the browser back to index.html, preserving the
        # original path as a query parameter so the Blazor router can restore it.
        run: |
          cat > publish/wwwroot/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8" />
            <title>SdkInfoApp</title>
            <script>
              // GitHub Pages SPA redirect — preserves the original URL via sessionStorage
              var segmentCount = 1; // number of path segments in the repo name (/SdkInfoApp)
              var l = window.location;
              l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
              );
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot/
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if any branch could not be scanned fresh
        # Runs after the deploy so the site (with fallback snapshots) is published,
        # but the job still turns red so the failure is not silent.
        if: ${{ !cancelled() && steps.scan.outputs.degraded != '' }}
        env:
          DEGRADED: ${{ steps.scan.outputs.degraded }}
        run: |
          echo "::error::Branches not freshly scanned (fallback used or excluded): $DEGRADED"
          exit 1
