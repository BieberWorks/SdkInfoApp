<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BieberWorks SDK Info</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <style>
        /* Pre-boot splash. Defaults to dark; honors the persisted light/dark preference. */
        html, body { margin: 0; }

        .preload-splash {
            display: flex; flex-direction: column; gap: 18px;
            justify-content: center; align-items: center; height: 100vh;
            font-family: 'Roboto', sans-serif; color: #b9b9c9;
            background: #1a1a27;
        }
        html.preload-light .preload-splash { background: #ffffff; color: #5a5a66; }

        .preload-spinner {
            width: 42px; height: 42px; border-radius: 50%;
            border: 4px solid rgba(124, 110, 240, 0.25);
            border-top-color: #7c6ef0;
            animation: preload-spin 0.9s linear infinite;
        }
        @keyframes preload-spin { to { transform: rotate(360deg); } }

        /* Graph fullscreen: fill the viewport */
        div[id^="cy-"]:fullscreen { width: 100% !important; height: 100vh !important; }
        div[id^="cy-"]:-webkit-full-screen { width: 100% !important; height: 100vh !important; }
    </style>
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            try {
                if (localStorage.getItem('sdkinfo.darkmode') === 'false') {
                    document.documentElement.classList.add('preload-light');
                }
            } catch (e) { /* localStorage unavailable — keep dark default */ }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div class="preload-splash">
            <div class="preload-spinner"></div>
            <p>Loading BieberWorks SDK Info…</p>
        </div>
    </div>

    <script src="lib/cytoscape.min.js"></script>
    <script src="lib/dagre.min.js"></script>
    <script src="lib/cytoscape-dagre.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
